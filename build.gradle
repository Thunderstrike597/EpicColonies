plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

runs {
    configureEach {
        workingDirectory project.file("run")
        modSource sourceSets.main

        systemProperties 'forge.logging.markers': 'REGISTRIES',
                'forge.logging.console.level': 'debug'

        systemProperty 'mixin.config', "${mod_id}.mixins.json"
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
        systemProperty 'forge.forcePacketLimit', '33554432'
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    data {
        workingDirectory project.file('run-data')
        programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "Progwml6's maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    flatDir {
        dir 'libs'
    }
}
configurations {
    minecoloniesNew
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation "curse.maven:embeddium-908741:6118392"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    implementation "curse.maven:just-enough-resources-jer-240630:6190140"

    implementation "curse.maven:patchouli-306770:6842247"

    implementation "curse.maven:blockui-522992:7790469"

    implementation "curse.maven:domum-ornamentum-527361:7585527"

    implementation "curse.maven:multi-piston-303278:7097877"

    implementation "curse.maven:structurize-298744:8398574"

    implementation "curse.maven:towntalk-900364:5653504"

    compileOnly "curse.maven:minecolonies-245506:7550841"

    minecoloniesNew "curse.maven:minecolonies-new-245506:8480342"
    implementation files(configurations.minecoloniesNew)

    implementation "curse.maven:epic-fight-mod-405076:8175609"

    implementation "curse.maven:epicfight-extra-1434276:8681592"
    compileOnly "curse.maven:epicfight-nightfall-1307848:8573921"
    compileOnly "curse.maven:epic-fight-avalon-1268823:7420442"
    implementation "curse.maven:epic-fight-invincible-1184379:8390375"

    implementation "curse.maven:geckolib-388172:8893490"
    implementation "curse.maven:curios-309927:6529130"
    implementation "curse.maven:playeranimator-658587:7389814"
    implementation "curse.maven:irons-lib-1492763:8973642"
    implementation "curse.maven:irons-spells-n-spellbooks-855414:8680204"

    implementation "curse.maven:minecolonies-mages-ironspells-integration-1506482:8441293"

    compileOnly "curse.maven:fantasy-armor-1083998:7850813"

    implementation "curse.maven:curios-309927:6529130"

    implementation "curse.maven:packet-fixer-689467:7221528"

    if (!gradle.startParameter.taskNames.any { it.toLowerCase().contains('runserver') }) {

        implementation "curse.maven:architectury-api-419699:5786327"

        implementation "curse.maven:ambientsounds-254284:6978999"

        implementation "curse.maven:creativecore-257814:8190065"

        implementation "curse.maven:particle-rain-421897:7725886"
    }

    implementation "curse.maven:betterdays-895618:7294209"
    implementation "curse.maven:configured-457570:7276577"
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neo_version,
            neoforge_version_range : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

java {
    withSourcesJar()
}

tasks.named('jar', Jar).configure {
    archiveBaseName = "${mod_jar_display_name}-${epic_fight_version}"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'net.kenji'
            artifactId = "${maven_local_name}-${epic_fight_version}"
            version = '1.4.0'
            from components.java
            pom.withXml {
                def node = asNode()
                node.remove(node.dependencies)
            }
        }
    }
    repositories {
        mavenLocal()
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: 'gradle/resource-validation.gradle'
